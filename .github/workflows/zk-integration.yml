name: ZK Integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: zk-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zk-integration:
    name: Halo2 end-to-end (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/prover-core

      - name: Build ZK artifacts
        run: bash scripts/build_zk_artifacts.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python prover tests
        working-directory: packages/prover
        run: |
          uv python install 3.11
          uv sync --dev
          uv run ruff check .
          uv run pytest --cov --cov-report=term-missing

      - name: LangChain tool tests
        working-directory: packages/langchain-tool
        run: |
          uv sync --dev
          uv run pytest --cov --cov-report=term-missing

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Foundry build and test
        working-directory: packages/contracts
        run: |
          forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-commit
          forge build
          forge test -vv

      - name: Demo app tests
        working-directory: packages/demo-app
        run: |
          npm ci
          npm run test

      - name: Upload ZK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zk-artifacts
          path: |
            packages/contracts/src/generated/Halo2Verifier.sol
            packages/contracts/test/fixtures/
            packages/prover/tests/fixtures/

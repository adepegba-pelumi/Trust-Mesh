name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [prover, langchain-tool]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build ZK artifacts
        run: bash scripts/build_zk_artifacts.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test with coverage
        env:
          TRUSTMESH_ALLOW_FIXTURES: "true"
        run: uv run pytest --cov --cov-report=term-missing

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    needs: []
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build ZK artifacts
        run: bash scripts/build_zk_artifacts.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vv

      - name: Gas report
        run: forge test --gas-report

  prover-core:
    name: Halo2 prover-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/prover-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/prover-core

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: Release benchmark
        run: |
          cargo build --release
          ./target/release/trustmesh-prove setup --output /tmp/trustmesh-keys --json
          ./target/release/trustmesh-prove benchmark \
            --witness fixtures/sample_witness.json \
            --keys /tmp/trustmesh-keys \
            --json | tee /tmp/benchmark.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: prover-core-benchmark
          path: /tmp/benchmark.json

  demo-app:
    name: Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/demo-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/demo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

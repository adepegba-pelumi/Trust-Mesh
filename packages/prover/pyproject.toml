[project]
name = "trustmesh-prover"
version = "0.1.0"
description = "TrustMesh zero-knowledge proving layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TrustMesh Contributors" }]
dependencies = [
    "numpy>=1.26",
    "py-ecc>=7.0",
    "requests>=2.31",
    "eth-abi>=5.0",
]

[project.optional-dependencies]
e2e = [
    "web3>=7.0",
    "eth-account>=0.13",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "web3>=7.0",
    "eth-account>=0.13",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustmesh_prover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["trustmesh_prover"]

[tool.coverage.report]
fail_under = 0

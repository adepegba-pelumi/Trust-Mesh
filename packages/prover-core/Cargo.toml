[package]
name = "trustmesh-prover-core"
version = "0.1.0"
edition = "2021"
description = "Halo2 proving core for TrustMesh agent inference verification"
license = "MIT"

[lib]
name = "trustmesh_prover_core"
path = "src/lib.rs"

[[bin]]
name = "trustmesh-prove"
path = "src/bin/trustmesh_prove.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", tag = "v0.3.0", default-features = false, features = ["dev-graph"] }
halo2curves = "0.6"
halo2_solidity_verifier = { git = "https://github.com/privacy-scaling-explorations/halo2-solidity-verifier" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"

[project]
name = "trustmesh-langchain"
version = "0.1.0"
description = "LangChain tooling for TrustMesh verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TrustMesh Contributors" }]
dependencies = [
    "trustmesh-prover",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "web3>=7.0",
    "eth-account>=0.13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
trustmesh-prover = { path = "../prover", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/trustmesh_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["trustmesh_langchain"]

[tool.coverage.report]
fail_under = 0
